{% extends "base.html" %}
{% block title %}{{ t.room_title }}{% endblock %}
{% block content %}
<div style="max-width:720px;margin:20px auto;padding:0 16px;text-align:center">
  <div style="font-size:14px;color:var(--muted)">{{ s.loc('title', lang) }} · {{ m.day.strftime('%d/%m/%Y') }}</div>
  <h1 style="font-size:clamp(22px,4vw,34px);color:var(--navy);margin:6px 0 14px">{{ t.room_title }}</h1>
  {% if s.check_mode == 'inout' %}<div style="display:flex;gap:10px;justify-content:center;margin-bottom:14px">
    <button type="button" class="dirbtn on" data-dir="in">{{ t.room_dir_in }}</button><button type="button" class="dirbtn" data-dir="out">{{ t.room_dir_out }}</button></div>{% endif %}
  <div id="qr" style="display:inline-block;padding:14px;border:4px solid var(--navy);border-radius:22px;background:#fff;width:min(78vw,460px);min-height:200px"></div>
  <p style="font-size:15px;color:var(--muted);line-height:1.7;margin:14px auto 0;max-width:520px">{{ t.room_hint }}</p>
  <p style="font-size:12px;color:var(--muted)"><i class="bi bi-arrow-repeat"></i> {{ t.room_refresh }}</p>
</div>
<style>.dirbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 26px;font-weight:800;font-size:17px;cursor:pointer}.dirbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}#qr svg{width:100%;height:auto;display:block}</style>
<script>
(function(){var dir='in',u='{{ url_for("room_qr", room_token=token) }}';
 document.querySelectorAll('.dirbtn').forEach(function(b){b.onclick=function(){dir=b.dataset.dir;document.querySelectorAll('.dirbtn').forEach(function(x){x.classList.toggle('on',x===b)});load()}});
 function load(){fetch(u+'?dir='+dir,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){document.getElementById('qr').innerHTML=d.svg}).catch(function(){})}
 load(); setInterval(load,{{ (window * 1000 // 3) }});})();
</script>
{% endblock %}
