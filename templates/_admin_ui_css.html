<style>
.co-wrap{max-width:1000px;margin:32px auto;padding:0 max(4vw,16px)}
.co-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:6px}
.co-head h1{font-size:22px;font-weight:800;color:var(--navy);margin:0}
.co-sub{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.6}
.co-pill{font-size:12px;font-weight:700;padding:8px 14px;border-radius:9px;text-decoration:none;background:var(--paper);color:var(--navy);border:1.5px solid var(--line)}
.co-card{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:22px;margin-bottom:22px}
.co-card h3{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.co-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.co-label{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;display:block}
.co-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;font-family:inherit}
.pass-opt{display:block;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;height:100%}
.pass-opt input{margin-inline-end:6px}
.pass-opt:has(input:checked){border-color:var(--orange);background:#fff7ed}
.pass-opt b{color:var(--navy)}
.pass-opt small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
.co-btn{border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:800;background:var(--orange);color:#fff;cursor:pointer;min-height:44px}
.co-tbl{width:100%;border-collapse:collapse;font-size:13px}
.co-tbl th{text-align:start;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 6px;border-bottom:1.5px solid var(--line)}
.co-tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.co-tbl a{color:var(--navy);font-weight:800;text-decoration:none}
.badge-pass{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;background:var(--sky);color:var(--navy)}
.co-note{font-size:12px;color:var(--muted);margin-top:10px}

.co-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.co-btn.sm{padding:7px 12px;font-size:12px;min-height:34px;border-radius:8px}
.co-btn.ghost{background:var(--sky);color:var(--navy)}
.co-btn.red{background:#fee2e2;color:#b91c1c}
.co-btn.green{background:#dcfce7;color:#15803d}
.st{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;display:inline-block}
.st-confirmed,.st-open,.st-present{background:#dcfce7;color:#15803d}
.st-pending,.st-draft,.st-late{background:#fef3c7;color:#b45309}
.st-waitlist,.st-running,.st-excused{background:var(--sky);color:var(--navy)}
.st-cancelled,.st-done,.st-absent{background:#fee2e2;color:#b91c1c}
.co-input.sm{padding:7px 9px;font-size:13px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--sky);border-radius:10px;padding:10px 12px;font-size:13px;direction:ltr;word-break:break-all}
</style>
