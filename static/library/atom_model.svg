<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <rect width="400" height="340" fill="#ffffff"/>
  <g transform="translate(200,170)">
    <ellipse rx="150" ry="55" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <ellipse rx="150" ry="55" fill="none" stroke="#1d4ed8" stroke-width="2" transform="rotate(60)"/>
    <ellipse rx="150" ry="55" fill="none" stroke="#1d4ed8" stroke-width="2" transform="rotate(120)"/>
    <!-- Nucleus -->
    <circle cx="4" cy="-3" r="9" fill="#ef4444"/>
    <circle cx="-6" cy="5" r="9" fill="#3b82f6"/>
    <circle cx="6" cy="7" r="9" fill="#ef4444"/>
    <circle cx="-4" cy="-6" r="9" fill="#3b82f6"/>
    <circle cx="0" cy="0" r="9" fill="#ef4444"/>
    <circle cx="-9" cy="0" r="9" fill="#3b82f6"/>
    <!-- Electrons -->
    <circle cx="150" cy="0" r="7" fill="#16a34a"/>
    <circle cx="-150" cy="0" r="7" fill="#16a34a"/>
    <circle cx="75" cy="47.6" r="7" fill="#16a34a" transform="rotate(60)"/>
    <circle cx="-75" cy="-47.6" r="7" fill="#16a34a" transform="rotate(60)"/>
    <circle cx="75" cy="-47.6" r="7" fill="#16a34a" transform="rotate(120)"/>
    <circle cx="-75" cy="47.6" r="7" fill="#16a34a" transform="rotate(120)"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#102a53">
    <circle cx="30" cy="300" r="7" fill="#ef4444"/><text x="45" y="304">Proton</text>
    <circle cx="120" cy="300" r="7" fill="#3b82f6"/><text x="135" y="304">Neutron</text>
    <circle cx="220" cy="300" r="7" fill="#16a34a"/><text x="235" y="304">Électron</text>
  </g>
  <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#102a53">Modèle de Bohr de l'atome — HaithemEduAI</text>
</svg>
