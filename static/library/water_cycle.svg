<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320">
  <rect width="460" height="320" fill="#eaf6ff"/>
  <!-- Sun -->
  <circle cx="60" cy="55" r="26" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <!-- Mountain -->
  <path d="M0 220 L90 110 L160 220 Z" fill="#a3a3a3"/>
  <path d="M70 150 L90 130 L110 150 Z" fill="#ffffff"/>
  <!-- Sea -->
  <rect x="0" y="220" width="460" height="100" fill="#60a5fa"/>
  <!-- Cloud -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
    <ellipse cx="300" cy="80" rx="46" ry="26"/>
    <ellipse cx="260" cy="90" rx="30" ry="20"/>
    <ellipse cx="340" cy="90" rx="30" ry="20"/>
  </g>
  <!-- Evaporation arrows -->
  <g stroke="#0ea5e9" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M160 240 C 200 160, 240 120, 275 100"/>
    <path d="M340 235 C 340 180, 330 140, 320 105"/>
  </g>
  <!-- Precipitation arrows -->
  <g stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M120 130 L100 210"/>
    <path d="M300 115 L290 210"/>
    <path d="M330 118 L345 210"/>
  </g>
  <!-- Runoff -->
  <path d="M95 215 C 130 240, 170 235, 200 225" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="12" fill="#102a53" font-weight="bold">
    <text x="180" y="150">Évaporation</text>
    <text x="345" y="150">Condensation</text>
    <text x="110" y="195">Précipitations</text>
    <text x="130" y="255">Ruissellement</text>
  </g>
  <text x="230" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#102a53">Cycle de l'eau — HaithemEduAI</text>
</svg>
